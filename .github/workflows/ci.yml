name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so the reproducibility check catches an upstream data change
    # even with no commits — Monday 03:00 UTC.
    - cron: "0 3 * * 1"

jobs:
  # Backend + AI test suite, excluding tests marked `model`. No torch/
  # ultralytics/mediapipe install (multi-GB, GPU-oriented) needed, so this
  # stays fast and runs on every push/PR.
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -m "not model" -q

  # The real YOLO/MediaPipe model tests (tests/test_perception.py,
  # tests/test_driver_intelligence.py). Separate job because the ML stack is
  # a multi-GB CPU install and these tests fetch sample images over the
  # network on first run; kept off pull_request so an external PR can't rack
  # up minutes downloading torch, but always runs on main.
  model-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt torch ultralytics mediapipe --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest -m model -q

  # Regression check for the paper's headline numbers: re-fetches STATS19 (DfT)
  # and the NHAI/Zenodo release live and re-derives every cited statistic,
  # asserting it lands within a tolerance band rather than an exact match (the
  # source data can be revised upstream). Off pull_request for the same reason
  # as model-tests: it downloads external data, so an untrusted PR shouldn't
  # trigger that traffic. Runs on every push to main and weekly, so a silent
  # break in the reproducibility story is caught even with no code changes.
  research-repro:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "numpy>=1.26,<2" "pandas>=2.0,<3" "scipy>=1.11" "scikit-learn>=1.4" "statsmodels>=0.14"
      - run: python scripts/check_reproducibility.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
