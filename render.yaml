# Render Blueprint for the backend. Deploy: connect this repo at
# render.com/select-repo. The frontend is deployed separately to Vercel — see
# README.md.
#
# The database is an external, persistent Postgres (Supabase), NOT a Render
# free instance — the free Render Postgres expires after ~30 days and took the
# backend down with it. TRIE_DATABASE_URL is therefore set manually in the
# Render dashboard (sync: false), as a bare postgresql:// URL that
# backend/app/core/config.py normalizes to the +asyncpg scheme.
services:
  - type: web
    name: trie-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: TRIE_DATABASE_URL
        sync: false
      - key: TRIE_SECRET_KEY
        # Render generates this once and keeps it stable across deploys.
        # Required: app.core.config defaults it to a fresh random value per
        # process (so no constant is ever committed), which would silently
        # invalidate every issued token on each restart if left unset here.
        generateValue: true
      - key: TRIE_CORS_ORIGINS
        # Update after the Vercel frontend is deployed, e.g.
        # '["https://your-project.vercel.app"]' — a bare "*" would let any
        # site call this API, which is fine for a first deploy but should
        # be narrowed once the real frontend URL is known.
        value: '["*"]'
